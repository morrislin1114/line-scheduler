# Optional Render Blueprint — create service from this file in the Render dashboard.
services:
  - type: web
    name: line-scheduler
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: XAI_API_KEY
        sync: false
      # Fallback only if DATABASE_URL is unset (ephemeral on Free):
      - key: DATABASE_PATH
        value: /tmp/shifts.db
