name: Keep Render awake

on:
  schedule:
    # Asked interval is 12 minutes. GitHub often delays or drops schedule
    # runs, so this will not actually fire every 12 minutes.
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health
        run: |
          curl -fsS -m 90 \
            -w "\ncode:%{http_code} time:%{time_total}s\n" \
            https://line-scheduler-ybzo.onrender.com/health
